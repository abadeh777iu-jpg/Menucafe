<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت منو</title>
<link rel="stylesheet" href="/admin.css">
<script defer src="/admin.js"></script>
</head>
<body>
<header class="admin-top">
  <div class="admin-wrap admin-top-inner">
    <div class="admin-id">
      <strong id="admin-restaurant">پنل مدیریت</strong>
      <small id="admin-user"></small>
    </div>
    <div class="admin-actions">
      <a id="admin-public" class="btn ghost" href="/" hidden>منوی عمومی</a>
      <button id="admin-logout" class="btn ghost" type="button" hidden>خروج</button>
    </div>
  </div>
</header>

<main class="admin-wrap">
  <p id="admin-status" class="admin-status" role="status" aria-live="polite"></p>

  <section id="login-view" class="panel login-panel" hidden>
    <h1>ورود به پنل مدیریت</h1>
    <p class="muted">با نام کاربری و رمز عبور اختصاصی رستوران خود وارد شوید.</p>
    <form id="login-form" class="stack" autocomplete="on">
      <label>نام کاربری
        <input name="username" type="text" autocomplete="username" required maxlength="40" dir="ltr">
      </label>
      <label>رمز عبور
        <input name="password" type="password" autocomplete="current-password" required maxlength="200" dir="ltr">
      </label>
      <button class="btn primary" type="submit">ورود</button>
      <p class="form-msg" data-msg role="status"></p>
    </form>
  </section>

  <div id="dashboard" hidden>
    <section class="panel" id="profile-panel">
      <h2>اطلاعات رستوران</h2>
      <form id="profile-form" class="grid-form">
        <label>نام رستوران <input name="name" required maxlength="80"></label>
        <label>نام لاتین <input name="englishName" maxlength="80" dir="ltr"></label>
        <label>نشان یا حرف لوگو <input name="mark" required maxlength="4"></label>
        <label>عنوان اصلی <input name="headline" required maxlength="120"></label>
        <label class="wide">متن کوتاه بالای منو <input name="note" maxlength="160"></label>
        <label class="wide">توضیحات <textarea name="description" rows="3" maxlength="400"></textarea></label>
        <label class="wide">متن پایین صفحه <input name="footer" maxlength="160"></label>
        <div class="wide actions">
          <button class="btn primary" type="submit">ذخیرهٔ اطلاعات</button>
          <a class="btn ghost" data-public-link href="/">مشاهدهٔ منو</a>
        </div>
        <p class="form-msg wide" data-msg role="status"></p>
      </form>
    </section>

    <section class="panel" id="theme-panel">
      <h2>تم منو</h2>
      <p class="muted">تم انتخابی برای همهٔ بازدیدکنندگان منوی این رستوران نمایش داده می‌شود.</p>
      <div id="theme-list" class="theme-grid" role="radiogroup" aria-label="تم منو"></div>
      <p class="form-msg" data-msg role="status"></p>
    </section>

    <section class="panel" id="category-panel">
      <h2>دسته‌بندی‌ها</h2>
      <div id="category-list" class="list"></div>
      <form id="category-form" class="grid-form">
        <input type="hidden" name="id">
        <label>نام دسته‌بندی <input name="name" required maxlength="40"></label>
        <label>آیکن
          <select name="icon" required></select>
        </label>
        <label>ترتیب نمایش <input name="position" type="number" min="0" max="9999" step="1" required></label>
        <div class="wide actions">
          <button class="btn primary" type="submit">ذخیره</button>
          <button class="btn ghost" type="button" data-reset="category">دسته جدید</button>
        </div>
        <p class="form-msg wide" data-msg role="status"></p>
      </form>
    </section>

    <section class="panel" id="item-panel">
      <h2>غذاها</h2>
      <div class="toolbar">
        <label>نمایش دسته
          <select id="item-filter"></select>
        </label>
        <button class="btn primary" type="button" id="item-new">غذای تازه</button>
      </div>
      <div id="item-list" class="list"></div>

      <form id="item-form" class="grid-form" hidden>
        <h3 id="item-form-title" class="wide">غذای تازه</h3>
        <input type="hidden" name="id">
        <label>نام غذا <input name="name" required maxlength="80"></label>
        <label>دسته‌بندی <select name="category" required></select></label>
        <label>قیمت (تومان) <input name="price" type="number" min="0" max="1000000000" step="1000" required dir="ltr"></label>
        <label>آیکن <select name="icon" required></select></label>
        <label>برچسب (اختیاری) <input name="label" maxlength="30"></label>
        <label>ترتیب نمایش <input name="position" type="number" min="0" max="99999" step="1" required></label>
        <label class="wide">حساسیت‌زاها (با «،» جدا کنید) <input name="allergens" maxlength="600"></label>
        <label class="wide">توضیحات <textarea name="description" rows="2" maxlength="400"></textarea></label>
        <label class="wide">ترکیبات <textarea name="ingredients" rows="2" maxlength="400"></textarea></label>
        <label class="check wide"><input name="visible" type="checkbox" checked> نمایش در منوی عمومی</label>
        <div class="wide actions">
          <button class="btn primary" type="submit">ذخیره</button>
          <button class="btn ghost" type="button" id="item-cancel">انصراف</button>
          <button class="btn danger" type="button" id="item-delete" hidden>حذف غذا</button>
        </div>
        <p class="form-msg wide" data-msg role="status"></p>
      </form>
    </section>
  </div>
</main>
</body>
</html>
